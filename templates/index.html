<!DOCTYPE html>
<html lang="zh" class="">
<head>
<meta charset="UTF-8">
<title>VIDEO ORGANIZER</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { mono: ['Courier New', 'monospace'] },
        colors: {
          green: {
            neon:  '#00ff41',
            dim:   '#00aa28',
            dark:  '#003310',
            faint: '#c8ffc8',
          },
          panel: '#0f0f0f',
        },
      }
    }
  }
</script>
<style>
  /* scanline overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 9999;
  }
  /* custom scrollbar */
  #file-list::-webkit-scrollbar { width: 4px; }
  .dark #file-list::-webkit-scrollbar-thumb { background: #00aa28; }
  #file-list::-webkit-scrollbar-thumb { background: #94a3b8; }
  /* progress head glow */
  #progress-head { box-shadow: 0 0 6px currentColor; }
  /* marker brace */
  .marker-brace {
    position: absolute; top: 50%; transform: translate(-50%,-50%);
    font-size: 18px; font-weight: bold; pointer-events: none;
    text-shadow: 0 0 6px currentColor;
  }
  /* segment highlight */
  .segment-highlight {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 6px; pointer-events: none;
  }
  /* play overlay animation */
  @keyframes fadeout { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
  #play-overlay.show { animation: fadeout 0.6s forwards; }
  /* loading spinner */
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  #loading-indicator { animation: spin 1s linear infinite; }
</style>
</head>
<body class="dark">
<!-- Theme init: read localStorage before render -->
<script>
  (function() {
    var theme = localStorage.getItem('videoOrgTheme') || 'dark';
    if (theme === 'light') {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
    }
  })();
</script>

<!-- Root -->
<div id="app" class="flex h-screen overflow-hidden
  bg-white text-slate-800
  dark:bg-[#0a0a0a] dark:text-green-faint
  font-mono">

  <!-- ── LEFT PANEL ───────────────────────────────── -->
  <div id="left" class="w-1/3 flex flex-col
    border-r border-slate-200 bg-slate-50
    dark:border-[#1e1e1e] dark:bg-panel">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3
      border-b border-slate-200 dark:border-[#1e1e1e]">
      <span class="text-xs tracking-widest uppercase
        text-emerald-600 dark:text-green-neon font-bold">
        ▍ VIDEO ORGANIZER
        <span id="loading-indicator"
          class="inline-block ml-1 text-emerald-500 dark:text-green-dim"
          style="display:none">⟳</span>
      </span>

      <!-- Theme toggle -->
      <button id="theme-toggle"
        onclick="toggleTheme()"
        title="Toggle light / dark"
        class="flex items-center gap-1 px-2 py-1 text-xs rounded
          border border-slate-300 text-slate-600
          hover:bg-slate-200 transition-colors
          dark:border-[#1e1e1e] dark:text-green-dim dark:hover:bg-[#1a1a1a]">
        <span id="theme-icon">☀️</span>
        <span id="theme-label" class="tracking-widest uppercase text-[10px]">Light</span>
      </button>
    </div>

    <!-- File list -->
    <div id="file-list" class="flex-1 overflow-y-auto"></div>

    <!-- Footer: PURGE -->
    <div class="px-4 py-3 border-t border-slate-200 dark:border-[#1e1e1e]">
      <button id="delete-all-btn" disabled onclick="confirmDeleteAll()"
        class="w-full py-2 text-xs tracking-widest uppercase
          border rounded transition-colors
          border-red-300 text-red-500 bg-transparent
          hover:bg-red-50 disabled:opacity-30 disabled:cursor-not-allowed
          dark:border-red-900 dark:text-red-500
          dark:hover:bg-red-950">
        ⚠ PURGE
      </button>
    </div>
  </div>

  <!-- ── RIGHT PANEL ──────────────────────────────── -->
  <div id="right" class="flex-1 flex flex-col bg-black min-w-0">

    <!-- Video area -->
    <div id="video-wrapper"
      onclick="togglePlay()"
      class="flex-1 flex items-center justify-center bg-black overflow-hidden cursor-pointer relative">
      <div id="no-video"
        class="text-xs tracking-widest pointer-events-none
          text-slate-500 dark:text-[#557755]">
        // SELECT FILE TO PLAY
      </div>
      <video id="player" class="max-w-full max-h-full block" style="display:none" preload="metadata"></video>
      <div id="play-overlay"
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
          text-5xl opacity-0 pointer-events-none text-white"></div>
    </div>

    <!-- Progress area -->
    <div id="progress-area"
      class="flex-shrink-0 flex flex-col gap-2 px-4 py-3
        border-t border-slate-200 bg-slate-50
        dark:border-[#1e1e1e] dark:bg-panel">

      <div id="time-display"
        class="text-[10px] tracking-widest
          text-slate-500 dark:text-[#557755]">
        00:00 / 00:00
      </div>

      <!-- Seek bar -->
      <div id="progress-container"
        class="relative w-full h-10 cursor-pointer flex items-center">
        <div id="progress-track"
          class="absolute inset-x-0 h-1.5 rounded-full
            bg-slate-200 dark:bg-[#1c1c1c]">
          <div id="progress-bar"
            class="h-full rounded-full bg-emerald-500 dark:bg-green-dim"
            style="width:0%"></div>
        </div>
        <div id="progress-head"
          class="absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full pointer-events-none
            bg-emerald-500 text-emerald-500
            dark:bg-green-neon dark:text-green-neon"
          style="left:0%"></div>
        <div id="markers-layer" class="absolute inset-0 pointer-events-none"></div>
      </div>

      <!-- Controls row -->
      <div id="controls-row" class="flex items-center gap-2">

        <!-- Left: Clear / Undo -->
        <div class="flex gap-2">
          <button onclick="clearMarkers()"
            class="ctrl-btn px-3 py-1.5 text-[11px] tracking-widest uppercase rounded
              border transition-all
              border-orange-300 text-orange-500 bg-transparent
              hover:bg-orange-50
              dark:border-yellow-900 dark:text-yellow-600 dark:hover:bg-yellow-950">
            ✕ CLEAR
          </button>
          <button onclick="undoMarker()"
            class="ctrl-btn px-3 py-1.5 text-[11px] tracking-widest uppercase rounded
              border transition-all
              border-orange-300 text-orange-500 bg-transparent
              hover:bg-orange-50
              dark:border-yellow-900 dark:text-yellow-600 dark:hover:bg-yellow-950">
            ↩ UNDO
          </button>
        </div>

        <!-- Center: Rename -->
        <div class="flex-1 flex justify-center">
          <button onclick="openRenameModal()"
            class="ctrl-btn px-3 py-1.5 text-[11px] tracking-widest uppercase rounded
              border transition-all
              border-emerald-400 text-emerald-600 bg-transparent
              hover:bg-emerald-50
              dark:border-green-dim dark:text-green-neon dark:hover:bg-green-dark">
            ✎ RENAME
          </button>
        </div>

        <!-- Right: Mark In / Out -->
        <div class="flex gap-2">
          <button onclick="markSegment('start')"
            class="ctrl-btn px-3 py-1.5 text-[11px] tracking-widest uppercase rounded
              border transition-all
              border-emerald-400 text-emerald-600 bg-transparent
              hover:bg-emerald-50
              dark:border-green-dim dark:text-green-neon dark:hover:bg-green-dark">
            { Mark In
          </button>
          <button onclick="markSegment('end')"
            class="ctrl-btn px-3 py-1.5 text-[11px] tracking-widest uppercase rounded
              border transition-all
              border-emerald-400 text-emerald-600 bg-transparent
              hover:bg-emerald-50
              dark:border-green-dim dark:text-green-neon dark:hover:bg-green-dark">
            Mark Out }
          </button>
        </div>

      </div>
    </div><!-- /progress-area -->
  </div><!-- /right -->
</div><!-- /app -->

<!-- ── RENAME MODAL ───────────────────────────────────── -->
<div id="modal-overlay"
  class="hidden fixed inset-0 bg-black/80 z-50 items-center justify-center">
  <div id="modal"
    class="w-[480px] max-w-[90vw] p-6 rounded
      border shadow-lg
      bg-white border-slate-200
      dark:bg-panel dark:border-green-dim dark:shadow-[0_0_30px_rgba(0,255,65,0.15)]">

    <h3 class="text-xs tracking-widest uppercase mb-4
      text-emerald-600 dark:text-green-neon">
      ✎ RENAME VIDEO
    </h3>

    <input id="modal-input" type="text"
      placeholder="Please enter a prefix, e.g. 1b2k"
      autocomplete="off" spellcheck="false"
      class="w-full px-3 py-2 text-sm tracking-widest outline-none rounded
        border bg-white text-slate-800
        border-slate-300 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-300
        dark:bg-black dark:text-green-neon dark:border-green-dim
        dark:focus:border-green-neon dark:focus:shadow-[0_0_8px_rgba(0,255,65,0.3)]
        font-mono" />

    <div id="modal-preview"
      class="text-[11px] mt-2 mb-1 min-h-[16px]
        text-slate-400 dark:text-[#557755]"></div>

    <div id="tag-list" class="flex flex-wrap gap-1.5 my-2 min-h-[28px]"></div>

    <div class="flex gap-2 justify-end mt-4">
      <button id="modal-cancel-btn" onclick="closeModal()"
        class="px-5 py-2 text-xs tracking-widest uppercase rounded
          border transition-all
          border-slate-300 text-slate-500 bg-transparent
          hover:border-slate-400 hover:text-slate-700
          dark:border-[#333] dark:text-[#557755] dark:hover:border-[#555] dark:hover:text-green-faint font-mono">
        CANCEL
      </button>
      <button id="modal-confirm-btn" onclick="doRename()"
        class="px-5 py-2 text-xs tracking-widest uppercase rounded
          border transition-all
          border-emerald-400 text-emerald-600 bg-emerald-50
          hover:bg-emerald-100
          dark:bg-green-dark dark:border-green-dim dark:text-green-neon
          dark:hover:bg-green-dim dark:hover:text-black font-mono">
        RENAME
      </button>
    </div>
  </div>
</div>

<script>
// ── Theme toggle ─────────────────────────────────────────
function applyTheme(theme) {
  const html = document.documentElement;
  const body = document.body;
  const icon  = document.getElementById('theme-icon');
  const label = document.getElementById('theme-label');
  if (theme === 'dark') {
    html.classList.add('dark');
    body.classList.add('dark');
    icon.textContent  = '☀️';
    label.textContent = 'Light';
  } else {
    html.classList.remove('dark');
    body.classList.remove('dark');
    icon.textContent  = '🌙';
    label.textContent = 'Dark';
  }
}
function toggleTheme() {
  const current = localStorage.getItem('videoOrgTheme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('videoOrgTheme', next);
  applyTheme(next);
}
// Init theme on load
(function() {
  var t = localStorage.getItem('videoOrgTheme') || 'dark';
  applyTheme(t);
})();

// ── App ───────────────────────────────────────────────────
const player = document.getElementById('player');
const progressBar = document.getElementById('progress-bar');
const progressHead = document.getElementById('progress-head');
const progressContainer = document.getElementById('progress-container');
const markersLayer = document.getElementById('markers-layer');
const timeDisplay = document.getElementById('time-display');
const fileListEl = document.getElementById('file-list');
const deleteAllBtn = document.getElementById('delete-all-btn');
const playOverlay = document.getElementById('play-overlay');
const modalOverlay = document.getElementById('modal-overlay');
const modalInput = document.getElementById('modal-input');
const modalPreview = document.getElementById('modal-preview');
const tagListEl = document.getElementById('tag-list');

let markers = [];
let pendingDeletes = new Set();
let isDragging = false;
let currentFile = null;
let knownTags = [];
let pendingRequests = 0;

function pushLoading() {
  pendingRequests++;
  document.getElementById('loading-indicator').style.display = 'inline-block';
}
function popLoading() {
  pendingRequests = Math.max(0, pendingRequests - 1);
  if (pendingRequests === 0) document.getElementById('loading-indicator').style.display = 'none';
}

function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
  return `${pad(m)}:${pad(sec)}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

function splitTags(prefix) {
  return (prefix.match(/(?:\d+[a-zA-Z_-]+|[a-zA-Z_-]+\d+)/g) || []);
}

// ── Progress / Playback ───────────────────────────────────
function updateProgress() {
  if (!player.duration) return;
  const pct = (player.currentTime / player.duration) * 100;
  progressBar.style.width = pct + '%';
  progressHead.style.left = pct + '%';
  timeDisplay.textContent = fmtTime(player.currentTime) + ' / ' + fmtTime(player.duration);
}
player.addEventListener('timeupdate', updateProgress);
player.addEventListener('loadedmetadata', () => { updateProgress(); renderMarkers(); });

function togglePlay() {
  if (!player.src || !player.duration) return;
  if (player.paused) { player.play(); playOverlay.textContent = '▶'; }
  else { player.pause(); playOverlay.textContent = '⏸'; }
  playOverlay.classList.remove('show');
  void playOverlay.offsetWidth;
  playOverlay.classList.add('show');
}

function getPercent(clientX) {
  const rect = progressContainer.getBoundingClientRect();
  return Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100));
}
function seekTo(pct) {
  if (!player.duration) return;
  player.currentTime = pct / 100 * player.duration;
  updateProgress();
}

progressContainer.addEventListener('mousedown', e => {
  isDragging = true; progressContainer.classList.add('dragging');
  seekTo(getPercent(e.clientX)); e.preventDefault();
});
document.addEventListener('mousemove', e => { if (isDragging) seekTo(getPercent(e.clientX)); });
document.addEventListener('mouseup', () => { isDragging = false; progressContainer.classList.remove('dragging'); });

progressContainer.addEventListener('touchstart', e => {
  isDragging = true; seekTo(getPercent(e.touches[0].clientX)); e.preventDefault();
}, { passive: false });
progressContainer.addEventListener('touchmove', e => {
  if (isDragging) seekTo(getPercent(e.touches[0].clientX)); e.preventDefault();
}, { passive: false });
progressContainer.addEventListener('touchend', () => { isDragging = false; });

// ── Markers ───────────────────────────────────────────────
function markSegment(type) {
  if (!player.src || !player.duration) return;
  const currentTime = player.currentTime;
  if (type === 'start') {
    let lastStartIdx = -1;
    for (let i = markers.length - 1; i >= 0; i--) {
      if (markers[i].type === 'start' && markers[i].time < currentTime) { lastStartIdx = i; break; }
    }
    if (lastStartIdx !== -1) {
      const lastStartTime = markers[lastStartIdx].time;
      const hasEndBetween = markers.some(m => m.type === 'end' && m.time > lastStartTime && m.time < currentTime);
      if (!hasEndBetween) markers.splice(lastStartIdx, 1);
    }
  } else if (type === 'end') {
    let lastEndIdx = -1;
    for (let i = markers.length - 1; i >= 0; i--) {
      if (markers[i].type === 'end' && markers[i].time < currentTime) { lastEndIdx = i; break; }
    }
    if (lastEndIdx !== -1) {
      const lastEndTime = markers[lastEndIdx].time;
      const hasStartBetween = markers.some(m => m.type === 'start' && m.time > lastEndTime && m.time < currentTime);
      if (!hasStartBetween) markers.splice(lastEndIdx, 1);
    }
  }
  markers.push({ type, time: currentTime });
  renderMarkers();
  saveMarkers();
}

function undoMarker() {
  if (!markers.length) return;
  markers.pop(); renderMarkers(); saveMarkers();
}

function clearMarkers() {
  if (!markers.length) return;
  if (!confirm('Clear all markers?')) return;
  markers = []; renderMarkers(); saveMarkers();
}

function isDark() { return document.documentElement.classList.contains('dark'); }

function renderMarkers() {
  markersLayer.innerHTML = '';
  if (!player.duration) return;
  const dur = player.duration;
  const starts = markers.filter(m => m.type==='start').map(m=>m.time).sort((a,b)=>a-b);
  const ends   = markers.filter(m => m.type==='end').map(m=>m.time).sort((a,b)=>a-b);
  const pairs = [];
  let si=0, ei=0;
  while (si<starts.length && ei<ends.length) {
    if (ends[ei]>starts[si]) { pairs.push([starts[si],ends[ei]]); si++; ei++; }
    else ei++;
  }
  const segColor = isDark() ? 'rgba(0,255,65,0.25)' : 'rgba(16,185,129,0.2)';
  const segBorder = isDark() ? '#00aa28' : '#10b981';
  pairs.forEach(([s,e]) => {
    const el = document.createElement('div');
    el.className = 'segment-highlight';
    el.style.cssText = `left:${s/dur*100}%;width:${(e-s)/dur*100}%;background:${segColor};border-top:1px solid ${segBorder};border-bottom:1px solid ${segBorder};`;
    markersLayer.appendChild(el);
  });
  const braceColor = isDark() ? '#00ff41' : '#059669';
  markers.forEach(m => {
    const el = document.createElement('div');
    el.className = 'marker-brace';
    el.style.cssText = `left:${m.time/dur*100}%;color:${braceColor};`;
    el.textContent = m.type==='start' ? '{' : '}';
    markersLayer.appendChild(el);
  });
}

function saveMarkers() {
  if (!currentFile || !player.duration) return;
  const dur = player.duration;
  const starts = markers.filter(m=>m.type==='start').map(m=>m.time).sort((a,b)=>a-b);
  const ends   = markers.filter(m=>m.type==='end').map(m=>m.time).sort((a,b)=>a-b);
  const pairs = [];
  let si=0, ei=0;
  while (si<starts.length && ei<ends.length) {
    if (ends[ei]>starts[si]) { pairs.push([starts[si],ends[ei]]); si++; ei++; }
    else ei++;
  }
  while (si<starts.length) { pairs.push([starts[si], dur]); si++; }
  const usedEnds = new Set(pairs.map(p=>p[1]).filter(v=>v!==dur));
  ends.forEach(e => { if (!usedEnds.has(e) && e!==dur) { pairs.push([0, e]); usedEnds.add(e); } });
  pairs.sort((a,b)=>a[0]-b[0]);
  const payload = { file: currentFile, duration: dur, markers, segments: pairs.map(([s,e])=>({start:s,end:e})) };
  pushLoading();
  fetch('/save_markers', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
  }).then(r=>r.json()).then(d=>{ if(d.ok) loadFileList(); }).finally(popLoading);
}

function loadMarkersFromFile(filename) {
  pushLoading();
  fetch('/load_markers/' + encodeURIComponent(filename))
    .then(r=>r.json())
    .then(d=>{ markers = d.markers || []; renderMarkers(); })
    .finally(popLoading);
}

// ── File list ─────────────────────────────────────────────
let fileCache = [];

function renderFileList() {
  fileListEl.innerHTML = '';
  fileCache.forEach(f => {
    const item = document.createElement('div');
    item.dataset.name = f.name;
    const isActive  = f.name === currentFile;
    const isPending = pendingDeletes.has(f.name);

    item.className = [
      'flex items-center gap-1.5 px-4 py-2.5 cursor-pointer transition-colors',
      'border-b border-slate-100 dark:border-[#1e1e1e]',
      isActive
        ? 'bg-emerald-50 border-l-2 border-l-emerald-500 dark:bg-green-dark dark:border-l-green-neon'
        : 'hover:bg-slate-100 dark:hover:bg-[#111]',
      isPending ? 'opacity-40 line-through' : ''
    ].join(' ');

    const safe = f.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    item.innerHTML = `
      ${f.has_json
        ? '<span class="text-xs flex-shrink-0 text-emerald-500 dark:text-green-neon" title="Has markers">◈</span>'
        : '<span class="w-4 flex-shrink-0 inline-block"></span>'}
      <span class="flex-1 text-xs break-all
        text-slate-700 dark:text-green-faint">${f.name}</span>
      <span class="text-[11px] whitespace-nowrap
        text-slate-400 dark:text-[#557755]">${f.duration}</span>
      <button
        class="flex-shrink-0 bg-transparent border-none cursor-pointer px-1 text-sm transition-colors
          text-slate-400 hover:text-red-500
          ${isPending ? 'text-red-500 dark:text-red-500' : 'dark:text-[#557755] dark:hover:text-red-500'}"
        title="Mark for deletion"
        onclick="event.stopPropagation();toggleDelete('${safe}',this)">🗑</button>
    `;
    item.addEventListener('click', () => loadFile(f.name));
    fileListEl.appendChild(item);
  });
}

function loadFileList() {
  pushLoading();
  fetch('/files').then(r=>r.json()).then(files => {
    fileCache = files;
    renderFileList();
    deleteAllBtn.disabled = pendingDeletes.size === 0;
  }).catch(err => console.error('[loadFileList]', err)).finally(popLoading);
}

function toggleDelete(filename, btn) {
  if (pendingDeletes.has(filename)) pendingDeletes.delete(filename);
  else pendingDeletes.add(filename);
  renderFileList();
  deleteAllBtn.disabled = pendingDeletes.size === 0;
}

function confirmDeleteAll() {
  if (!pendingDeletes.size) return;
  const toDelete = Array.from(pendingDeletes);
  if (!confirm(`Delete ${toDelete.length} file(s)\n\n${toDelete.join('\n')}`)) return;
  fileCache = fileCache.filter(f => !pendingDeletes.has(f.name));
  pendingDeletes.clear();
  deleteAllBtn.disabled = true;
  renderFileList();
  pushLoading();
  fetch('/delete', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ files: toDelete })
  }).then(r=>r.json()).then(d=>{
    if (!d.ok) { alert('Delete failed: ' + d.error); loadFileList(); }
  }).catch(err => { console.error('[confirmDeleteAll]', err); loadFileList(); }).finally(popLoading);
}

function loadFile(filename) {
  currentFile = filename;
  markers = [];
  markersLayer.innerHTML = '';
  progressBar.style.width = '0%';
  progressHead.style.left = '0%';
  document.getElementById('no-video').style.display = 'none';
  player.style.display = 'block';
  player.src = '/video/' + encodeURIComponent(filename);
  player.play();
  document.querySelectorAll('#file-list > div').forEach(el => {
    const isActive = el.dataset.name === filename;
    el.classList.toggle('bg-emerald-50', isActive);
    el.classList.toggle('border-l-2', isActive);
    el.classList.toggle('border-l-emerald-500', isActive);
    el.classList.toggle('dark:bg-green-dark', isActive);
    el.classList.toggle('dark:border-l-green-neon', isActive);
    el.classList.toggle('hover:bg-slate-100', !isActive);
    el.classList.toggle('dark:hover:bg-[#111]', !isActive);
  });
  loadMarkersFromFile(filename);
}

// ── Rename Modal ──────────────────────────────────────────
function openRenameModal() {
  if (!currentFile) { alert('Please select a video file first'); return; }
  modalInput.value = '';
  modalPreview.textContent = '';
  renderTagChips();
  modalOverlay.classList.remove('hidden');
  modalOverlay.classList.add('flex');
  modalInput.focus();
}

function closeModal() {
  modalOverlay.classList.add('hidden');
  modalOverlay.classList.remove('flex');
}

modalInput.addEventListener('input', () => {
  const val = modalInput.value.trim();
  modalPreview.textContent = val ? '→ ' + val + currentFile : '';
});
modalInput.addEventListener('keydown', e => { if (e.key === 'Enter') doRename(); if (e.key === 'Escape') closeModal(); });

function renderTagChips() {
  tagListEl.innerHTML = '';
  knownTags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = [
      'px-2.5 py-1 text-[11px] cursor-pointer rounded font-mono transition-all',
      'border',
      'border-slate-300 text-slate-500 hover:bg-slate-100 hover:text-slate-700',
      'dark:border-green-dim dark:text-green-dim dark:hover:bg-green-dark dark:hover:text-green-neon dark:hover:border-green-neon'
    ].join(' ');
    chip.textContent = tag;
    chip.onclick = () => { modalInput.value += tag; modalInput.dispatchEvent(new Event('input')); modalInput.focus(); };
    tagListEl.appendChild(chip);
  });
}

function doRename() {
  const prefix = modalInput.value.trim();
  if (!prefix) { alert('Please enter a prefix'); return; }
  if (!currentFile) return;
  const oldName = currentFile;
  const newName = prefix + currentFile;
  closeModal();
  const wasPlaying = !player.paused;
  const ct = player.currentTime;
  const cacheIdx = fileCache.findIndex(f => f.name === oldName);
  if (cacheIdx !== -1) fileCache[cacheIdx] = { ...fileCache[cacheIdx], name: newName };
  if (pendingDeletes.has(oldName)) { pendingDeletes.delete(oldName); pendingDeletes.add(newName); }
  currentFile = newName;
  renderFileList();
  player.src = '/video/' + encodeURIComponent(newName);
  player.currentTime = ct;
  if (wasPlaying) player.play();
  pushLoading();
  fetch('/rename', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ old_name: oldName, new_name: newName, prefix })
  }).then(r=>r.json()).then(d=>{
    if (d.ok) {
      knownTags = d.tags; renderTagChips(); loadFileList();
    } else {
      alert('Rename failed: ' + (d.error || ''));
      if (cacheIdx !== -1) fileCache[cacheIdx] = { ...fileCache[cacheIdx], name: oldName };
      if (pendingDeletes.has(newName)) { pendingDeletes.delete(newName); pendingDeletes.add(oldName); }
      currentFile = oldName;
      player.src = '/video/' + encodeURIComponent(oldName);
      player.currentTime = ct;
      if (wasPlaying) player.play();
      renderFileList();
    }
  }).catch(err => { console.error('[doRename]', err); loadFileList(); }).finally(popLoading);
}

// ── Init ──────────────────────────────────────────────────
fetch('/tags').then(r=>r.json()).then(d=>{ knownTags=d.tags; });
loadFileList();
modalOverlay.addEventListener('click', e => { if(e.target===modalOverlay) closeModal(); });
</script>
</body>
</html>
