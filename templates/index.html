<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEO ORGANIZER</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#eef2ff', 100: '#e0e7ff', 400: '#818cf8',
            500: '#6366f1', 600: '#4f46e5', 700: '#4338ca'
          }
        }
      }
    }
  }
</script>

<style type="text/tailwindcss">
  @layer utilities {
    .file-item.active {
      @apply bg-brand-50 dark:bg-brand-600/20 border-l-4 border-brand-500;
    }
    .file-item.pending-delete {
      @apply opacity-40 line-through;
    }
    .trash-btn.marked {
      @apply text-red-500;
    }
    #progress-container.dragging #progress-head {
      transform: translate(-50%, -50%) scale(1.5);
    }
    #play-overlay.show {
      animation: fadeout 0.6s forwards;
    }
    @keyframes fadeout {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
    #modal-overlay.open {
      @apply flex;
    }
    .segment-highlight {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 8px;
      border-radius: 4px;
      @apply bg-brand-500/30 border-y border-brand-500;
    }
    .marker-brace {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 700;
      @apply text-brand-500;
    }
  }
</style>
</head>

<body class="h-screen w-screen overflow-hidden bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans">

<div id="app" class="flex h-full w-full">

  <!-- LEFT: file list panel -->
  <div id="left" class="w-1/3 min-w-[260px] max-w-[420px] flex flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <div id="left-header" class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center gap-2">
        <span class="text-sm font-semibold tracking-wide text-slate-700 dark:text-slate-200">📁 VIDEO ORGANIZER</span>
        <svg id="loading-indicator" class="hidden animate-spin h-4 w-4 text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </div>
      <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark theme"
        class="px-3 py-1.5 rounded-md text-xs font-medium tracking-wide
               bg-white text-slate-700 border border-slate-300 shadow-sm hover:bg-slate-50
               dark:bg-slate-800 dark:text-slate-200 dark:border-slate-700 dark:hover:bg-slate-700
               transition-colors">
        🌙 DARK
      </button>
    </div>

    <div id="file-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800"></div>

    <div id="left-footer" class="p-3 border-t border-slate-200 dark:border-slate-800">
      <button id="delete-all-btn" disabled onclick="confirmDeleteAll()"
        class="w-full py-2 rounded-md text-sm font-medium border border-red-300 text-red-600
               hover:bg-red-50 disabled:opacity-30 disabled:cursor-not-allowed
               dark:border-red-800 dark:text-red-400 dark:hover:bg-red-950/40 transition-colors">
        🗑 PURGE SELECTED
      </button>
    </div>
  </div>

  <!-- RIGHT: player + controls -->
  <div id="right" class="flex-1 flex flex-col bg-slate-50 dark:bg-black min-w-0">

    <div id="video-wrapper" onclick="togglePlay()"
      class="flex-1 flex items-center justify-center bg-slate-200 dark:bg-black overflow-hidden cursor-pointer relative">
      <div id="no-video" class="text-slate-400 dark:text-slate-500 text-sm tracking-widest pointer-events-none">
        SELECT A FILE TO PLAY
      </div>
      <video id="player" class="max-w-full max-h-full hidden" preload="metadata"></video>
      <div id="play-overlay" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-5xl text-white opacity-0 pointer-events-none"></div>
    </div>

    <div id="progress-area" class="flex flex-col gap-2 px-4 py-3 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
      <div id="time-display" class="text-xs text-slate-500 dark:text-slate-400 tracking-wide">00:00 / 00:00</div>

      <div id="progress-container" class="relative w-full h-10 flex items-center cursor-pointer">
        <div id="progress-track" class="absolute left-0 right-0 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700"></div>
        <div id="progress-bar" class="absolute left-0 h-1.5 rounded-full bg-brand-500" style="width:0%"></div>
        <div id="progress-head" class="absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full bg-brand-500 shadow ring-2 ring-white dark:ring-slate-900" style="left:0%"></div>
        <div id="markers-layer" class="absolute inset-0 pointer-events-none"></div>
      </div>

      <div id="controls-row" class="flex items-center gap-2 flex-wrap">
        <div id="controls-left" class="flex gap-2">
          <button class="ctrl-btn px-3 py-1.5 rounded-md text-xs font-medium border border-amber-300 text-amber-600
                          hover:bg-amber-50 dark:border-amber-700 dark:text-amber-400 dark:hover:bg-amber-950/40 transition-colors"
                  onclick="clearMarkers()">✕ CLEAR</button>
          <button class="ctrl-btn px-3 py-1.5 rounded-md text-xs font-medium border border-amber-300 text-amber-600
                          hover:bg-amber-50 dark:border-amber-700 dark:text-amber-400 dark:hover:bg-amber-950/40 transition-colors"
                  onclick="undoMarker()">↩ UNDO</button>
        </div>

        <div id="controls-center" class="flex-1 flex justify-center">
          <button class="ctrl-btn px-4 py-1.5 rounded-md text-xs font-medium border border-slate-300 text-slate-600
                          hover:bg-slate-100 dark:border-slate-600 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors"
                  onclick="openRenameModal()">✎ RENAME</button>
        </div>

        <div id="controls-right" class="flex gap-2">
          <button class="ctrl-btn px-3 py-1.5 rounded-md text-xs font-medium border border-brand-400 text-brand-600
                          hover:bg-brand-50 dark:border-brand-500 dark:text-brand-400 dark:hover:bg-brand-950/40 transition-colors"
                  onclick="markSegment('start')">{ Mark In</button>
          <button class="ctrl-btn px-3 py-1.5 rounded-md text-xs font-medium border border-brand-400 text-brand-600
                          hover:bg-brand-50 dark:border-brand-500 dark:text-brand-400 dark:hover:bg-brand-950/40 transition-colors"
                  onclick="markSegment('end')">Mark Out }</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div id="modal-overlay" class="hidden fixed inset-0 z-[1000] bg-black/60 items-center justify-center">
  <div id="modal" class="w-[480px] max-w-[90vw] rounded-lg p-6 shadow-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
    <h3 class="text-sm font-semibold tracking-wide mb-4 text-slate-700 dark:text-slate-200">✎ RENAME VIDEO</h3>
    <input id="modal-input" type="text" placeholder="Please enter a prefix, e.g. 1b2k" autocomplete="off" spellcheck="false"
      class="w-full px-3 py-2 rounded-md text-sm border border-slate-300 bg-white text-slate-800
             focus:outline-none focus:ring-2 focus:ring-brand-500
             dark:bg-slate-800 dark:border-slate-600 dark:text-slate-100" />
    <div id="modal-preview" class="text-xs text-slate-500 dark:text-slate-400 mt-2 min-h-[16px]"></div>
    <div id="tag-list" class="flex flex-wrap gap-2 my-3 min-h-[28px]"></div>
    <div id="modal-actions" class="flex justify-end gap-2">
      <button id="modal-cancel-btn" onclick="closeModal()"
        class="px-4 py-2 rounded-md text-xs font-medium border border-slate-300 text-slate-600
               hover:bg-slate-100 dark:border-slate-600 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors">CANCEL</button>
      <button id="modal-confirm-btn" onclick="doRename()"
        class="px-4 py-2 rounded-md text-xs font-medium bg-brand-600 text-white hover:bg-brand-700 transition-colors">RENAME</button>
    </div>
  </div>
</div>

<script>
const player = document.getElementById('player');
const progressBar = document.getElementById('progress-bar');
const progressHead = document.getElementById('progress-head');
const progressContainer = document.getElementById('progress-container');
const markersLayer = document.getElementById('markers-layer');
const timeDisplay = document.getElementById('time-display');
const fileListEl = document.getElementById('file-list');
const deleteAllBtn = document.getElementById('delete-all-btn');
const playOverlay = document.getElementById('play-overlay');
const modalOverlay = document.getElementById('modal-overlay');
const modalInput = document.getElementById('modal-input');
const modalPreview = document.getElementById('modal-preview');
const tagListEl = document.getElementById('tag-list');

let markers = [];
let pendingDeletes = new Set();
let isDragging = false;
let currentFile = null;
let knownTags = [];

let pendingRequests = 0;

function pushLoading() {
  pendingRequests++;
  console.log(`[loading] pendingRequests=${pendingRequests}`);
  document.getElementById('loading-indicator').classList.remove('hidden');
}

function popLoading() {
  pendingRequests = Math.max(0, pendingRequests - 1);
  console.log(`[loading] pendingRequests=${pendingRequests}`);
  if (pendingRequests === 0) {
    document.getElementById('loading-indicator').classList.add('hidden');
  }
}

// ── Helpers ──────────────────────────────────────────────
function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
  return `${pad(m)}:${pad(sec)}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

function splitTags(prefix) {
  // split on digit/letter boundaries: 1b2k -> ['1b','2k']
  return (prefix.match(/(?:\d+[a-zA-Z_-]+|[a-zA-Z_-]+\d+)/g) || []);
}

// ── Progress / Playback ───────────────────────────────────
function updateProgress() {
  if (!player.duration) return;
  const pct = (player.currentTime / player.duration) * 100;
  progressBar.style.width = pct + '%';
  progressHead.style.left = pct + '%';
  timeDisplay.textContent = fmtTime(player.currentTime) + ' / ' + fmtTime(player.duration);
}
player.addEventListener('timeupdate', updateProgress);
player.addEventListener('loadedmetadata', () => { updateProgress(); renderMarkers(); });

function togglePlay() {
  if (!player.src || !player.duration) return;
  if (player.paused) { player.play(); playOverlay.textContent = '▶'; }
  else { player.pause(); playOverlay.textContent = '⏸'; }
  playOverlay.classList.remove('show');
  void playOverlay.offsetWidth;
  playOverlay.classList.add('show');
}

function getPercent(clientX) {
  const rect = progressContainer.getBoundingClientRect();
  return Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100));
}
function seekTo(pct) {
  if (!player.duration) return;
  player.currentTime = pct / 100 * player.duration;
  updateProgress();
}

progressContainer.addEventListener('mousedown', e => {
  isDragging = true; progressContainer.classList.add('dragging');
  seekTo(getPercent(e.clientX)); e.preventDefault();
});
document.addEventListener('mousemove', e => { if (isDragging) seekTo(getPercent(e.clientX)); });
document.addEventListener('mouseup', () => { isDragging = false; progressContainer.classList.remove('dragging'); });

progressContainer.addEventListener('touchstart', e => {
  isDragging = true; seekTo(getPercent(e.touches[0].clientX)); e.preventDefault();
}, { passive: false });
progressContainer.addEventListener('touchmove', e => {
  if (isDragging) seekTo(getPercent(e.touches[0].clientX)); e.preventDefault();
}, { passive: false });
progressContainer.addEventListener('touchend', () => { isDragging = false; });

// ── Markers ───────────────────────────────────────────────
function markSegment(type) {
  if (!player.src || !player.duration) return;
  const currentTime = player.currentTime;

  console.log(`[markSegment] type=${type} currentTime=${currentTime.toFixed(3)} markers_before=`, JSON.stringify(markers));

  if (type === 'start') {
    let lastStartIdx = -1;
    for (let i = markers.length - 1; i >= 0; i--) {
      if (markers[i].type === 'start' && markers[i].time < currentTime) {
        lastStartIdx = i;
        break;
      }
    }

    if (lastStartIdx !== -1) {
      const lastStartTime = markers[lastStartIdx].time;
      const hasEndBetween = markers.some(
        m => m.type === 'end' && m.time > lastStartTime && m.time < currentTime
      );
      console.log(`[markSegment] lastStartIdx=${lastStartIdx} lastStartTime=${lastStartTime.toFixed(3)} hasEndBetween=${hasEndBetween}`);
      if (!hasEndBetween) {
        console.log(`[markSegment] removing orphan start marker at index=${lastStartIdx} time=${lastStartTime.toFixed(3)}`);
        markers.splice(lastStartIdx, 1);
      }
    }
  } else if (type === 'end') {
    let lastEndIdx = -1;
    for (let i = markers.length - 1; i >= 0; i--) {
      if (markers[i].type === 'end' && markers[i].time < currentTime) {
        lastEndIdx = i;
        break;
      }
    }

    if (lastEndIdx !== -1) {
      const lastEndTime = markers[lastEndIdx].time;
      const hasStartBetween = markers.some(
        m => m.type === 'start' && m.time > lastEndTime && m.time < currentTime
      );
      console.log(`[markSegment] lastEndIdx=${lastEndIdx} lastEndTime=${lastEndTime.toFixed(3)} hasStartBetween=${hasStartBetween}`);
      if (!hasStartBetween) {
        console.log(`[markSegment] removing orphan end marker at index=${lastEndIdx} time=${lastEndTime.toFixed(3)}`);
        markers.splice(lastEndIdx, 1);
      }
    }
  }

  markers.push({ type, time: currentTime });
  console.log(`[markSegment] markers_after=`, JSON.stringify(markers));

  renderMarkers();
  saveMarkers();
}

function undoMarker() {
  if (!markers.length) return;
  markers.pop();
  renderMarkers();
  saveMarkers();
}

function clearMarkers() {
  if (!markers.length) return;
  if (!confirm('Clear all markers?')) return;
  markers = [];
  renderMarkers();
  saveMarkers();
}

function renderMarkers() {
  markersLayer.innerHTML = '';
  if (!player.duration) return;
  const dur = player.duration;
  const starts = markers.filter(m => m.type==='start').map(m=>m.time).sort((a,b)=>a-b);
  const ends   = markers.filter(m => m.type==='end').map(m=>m.time).sort((a,b)=>a-b);
  const pairs = [];
  let si=0, ei=0;
  while (si<starts.length && ei<ends.length) {
    if (ends[ei]>starts[si]) { pairs.push([starts[si],ends[ei]]); si++; ei++; }
    else ei++;
  }
  pairs.forEach(([s,e]) => {
    const el = document.createElement('div');
    el.className = 'segment-highlight';
    el.style.left  = (s/dur*100)+'%';
    el.style.width = ((e-s)/dur*100)+'%';
    markersLayer.appendChild(el);
  });
  markers.forEach(m => {
    const el = document.createElement('div');
    el.className = 'marker-brace';
    el.style.left = (m.time/dur*100)+'%';
    el.textContent = m.type==='start' ? '{' : '}';
    markersLayer.appendChild(el);
  });
}

function saveMarkers() {
  if (!currentFile || !player.duration) return;
  const dur = player.duration;
  const starts = markers.filter(m=>m.type==='start').map(m=>m.time).sort((a,b)=>a-b);
  const ends   = markers.filter(m=>m.type==='end').map(m=>m.time).sort((a,b)=>a-b);
  const pairs = [];
  let si=0, ei=0;
  while (si<starts.length && ei<ends.length) {
    if (ends[ei]>starts[si]) { pairs.push([starts[si],ends[ei]]); si++; ei++; }
    else ei++;
  }
  while (si<starts.length) { pairs.push([starts[si], dur]); si++; }
  const usedEnds = new Set(pairs.map(p=>p[1]).filter(v=>v!==dur));
  ends.forEach(e => {
    if (!usedEnds.has(e) && e!==dur) { pairs.push([0, e]); usedEnds.add(e); }
  });
  pairs.sort((a,b)=>a[0]-b[0]);
  const payload = { file: currentFile, duration: dur, markers: markers, segments: pairs.map(([s,e])=>({start:s,end:e})) };

  pushLoading();
  fetch('/save_markers', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).then(r=>r.json()).then(d=>{ if(d.ok) loadFileList(); }).finally(() => {
    popLoading();
  });
}

function loadMarkersFromFile(filename) {
  pushLoading();
  fetch('/load_markers/' + encodeURIComponent(filename))
    .then(r=>r.json())
    .then(d=>{ markers = d.markers || []; renderMarkers(); }).finally(() => {
      popLoading();
    });
}

// ── File list ─────────────────────────────────────────────
let fileCache = [];

function renderFileList() {
  fileListEl.innerHTML = '';
  fileCache.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item flex items-center gap-2 px-4 py-2.5 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors';
    item.dataset.name = f.name;
    if (f.name === currentFile) item.classList.add('active');
    if (pendingDeletes.has(f.name)) item.classList.add('pending-delete');

    const safe = f.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    item.innerHTML = `
      ${f.has_json ? '<span class="has-json-icon text-brand-500 text-xs flex-shrink-0" title="Has markers">◈</span>' : '<span class="w-3 flex-shrink-0"></span>'}
      <span class="file-name flex-1 text-sm text-slate-700 dark:text-slate-200 break-all">${f.name}</span>
      <span class="file-dur text-xs text-slate-400 dark:text-slate-500 whitespace-nowrap">${f.duration}</span>
      <button class="trash-btn${pendingDeletes.has(f.name) ? ' marked' : ''} text-slate-400 hover:text-red-500 text-sm px-1 flex-shrink-0" title="Mark for deletion" onclick="event.stopPropagation();toggleDelete('${safe}',this)">🗑</button>
    `;
    item.addEventListener('click', () => loadFile(f.name));
    fileListEl.appendChild(item);
  });
}

function loadFileList() {
  pushLoading();
  fetch('/files').then(r => r.json()).then(files => {
    fileCache = files;
    renderFileList();
    deleteAllBtn.disabled = pendingDeletes.size === 0;
    console.log(`[loadFileList] loaded ${files.length} files`);
  }).catch(err => {
    console.error('[loadFileList] fetch error:', err);
  }).finally(() => {
    popLoading();
  });
}

function toggleDelete(filename, btn) {
  if (pendingDeletes.has(filename)) {
    pendingDeletes.delete(filename);
  } else {
    pendingDeletes.add(filename);
  }
  console.log(`[toggleDelete] ${filename} pendingDeletes=`, Array.from(pendingDeletes));
  renderFileList();
  deleteAllBtn.disabled = pendingDeletes.size === 0;
}

function confirmDeleteAll() {
  if (!pendingDeletes.size) return;
  const toDelete = Array.from(pendingDeletes);
  if (!confirm(`Delete ${toDelete.length} file(s)\n\n${toDelete.join('\n')}`)) return;

  fileCache = fileCache.filter(f => !pendingDeletes.has(f.name));
  pendingDeletes.clear();
  deleteAllBtn.disabled = true;
  renderFileList();
  console.log(`[confirmDeleteAll] optimistic removal done, sending delete request`);

  pushLoading();
  fetch('/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: toDelete })
  }).then(r => r.json()).then(d => {
    console.log('[confirmDeleteAll] server response:', d);
    if (!d.ok) {
      alert('Delete failed: ' + d.error);
      loadFileList();
    }
  }).catch(err => {
    console.error('[confirmDeleteAll] fetch error:', err);
    loadFileList();
  }).finally(() => {
    popLoading();
  });
}

function loadFile(filename) {
  currentFile = filename;
  markers = [];
  markersLayer.innerHTML = '';
  progressBar.style.width = '0%';
  progressHead.style.left = '0%';
  document.getElementById('no-video').style.display = 'none';
  player.classList.remove('hidden');
  player.src = '/video/' + encodeURIComponent(filename);
  player.play();
  document.querySelectorAll('.file-item').forEach(el => el.classList.toggle('active', el.dataset.name===filename));
  loadMarkersFromFile(filename);
}

// ── Rename Modal ──────────────────────────────────────────
function openRenameModal() {
  if (!currentFile) { alert('Please select a video file first'); return; }
  modalInput.value = '';
  modalPreview.textContent = '';
  renderTagChips();
  modalOverlay.classList.remove('hidden');
  modalOverlay.classList.add('open');
  modalInput.focus();
}

function closeModal() {
  modalOverlay.classList.remove('open');
  modalOverlay.classList.add('hidden');
}

modalInput.addEventListener('input', () => {
  const val = modalInput.value.trim();
  if (val) {
    modalPreview.textContent = '→ ' + val + currentFile;
  } else {
    modalPreview.textContent = '';
  }
});

modalInput.addEventListener('keydown', e => { if (e.key === 'Enter') doRename(); if (e.key === 'Escape') closeModal(); });

function renderTagChips() {
  tagListEl.innerHTML = '';
  knownTags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip px-2.5 py-1 rounded-full text-xs cursor-pointer border border-brand-300 text-brand-600 hover:bg-brand-50 dark:border-brand-600 dark:text-brand-400 dark:hover:bg-brand-950/40 transition-colors';
    chip.textContent = tag;
    chip.onclick = () => { modalInput.value += tag; modalInput.dispatchEvent(new Event('input')); modalInput.focus(); };
    tagListEl.appendChild(chip);
  });
}

function doRename() {
  const prefix = modalInput.value.trim();
  if (!prefix) { alert('Please enter a prefix'); return; }
  if (!currentFile) return;

  const oldName = currentFile;
  const newName = prefix + currentFile;

  closeModal();
  const wasPlaying = !player.paused;
  const ct = player.currentTime;

  const cacheIdx = fileCache.findIndex(f => f.name === oldName);
  if (cacheIdx !== -1) {
    fileCache[cacheIdx] = { ...fileCache[cacheIdx], name: newName };
  }
  if (pendingDeletes.has(oldName)) {
    pendingDeletes.delete(oldName);
    pendingDeletes.add(newName);
  }
  currentFile = newName;
  renderFileList();

  player.src = '/video/' + encodeURIComponent(newName);
  player.currentTime = ct;
  if (wasPlaying) player.play();

  console.log(`[doRename] optimistic rename: ${oldName} -> ${newName}`);

  pushLoading();
  fetch('/rename', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ old_name: oldName, new_name: newName, prefix: prefix })
  }).then(r => r.json()).then(d => {
    console.log('[doRename] server response:', d);
    if (d.ok) {
      knownTags = d.tags;
      renderTagChips();
      loadFileList();
    } else {
      alert('Rename failed: ' + (d.error || ''));
      console.warn('[doRename] rolling back optimistic update');
      if (cacheIdx !== -1) {
        fileCache[cacheIdx] = { ...fileCache[cacheIdx], name: oldName };
      }
      if (pendingDeletes.has(newName)) {
        pendingDeletes.delete(newName);
        pendingDeletes.add(oldName);
      }
      currentFile = oldName;
      player.src = '/video/' + encodeURIComponent(oldName);
      player.currentTime = ct;
      if (wasPlaying) player.play();
      renderFileList();
    }
  }).catch(err => {
    console.error('[doRename] fetch error:', err);
    loadFileList();
  }).finally(() => {
    popLoading();
  });
}

// ── Theme Toggle ──────────────────────────────────────────
(function() {
  const saved = localStorage.getItem('theme');
  const btn = document.getElementById('theme-toggle');
  if (saved === 'light') {
    document.documentElement.classList.remove('dark');
    btn.textContent = '☀ LIGHT';
  } else {
    document.documentElement.classList.add('dark');
    btn.textContent = '🌙 DARK';
  }
})();

function toggleTheme() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  if (root.classList.contains('dark')) {
    root.classList.remove('dark');
    localStorage.setItem('theme', 'light');
    btn.textContent = '☀ LIGHT';
  } else {
    root.classList.add('dark');
    localStorage.setItem('theme', 'dark');
    btn.textContent = '🌙 DARK';
  }
}
</script>
